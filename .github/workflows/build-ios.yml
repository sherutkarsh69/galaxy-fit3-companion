name: Build Galaxy Fit3 iOS Companion (IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build & Package iOS App (.ipa)
    runs-on: macos-14 # Apple Silicon (M2) runner with Xcode 15/16

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project (.xcodeproj)
        run: |
          cd ios
          xcodegen generate --spec project.yml
          ls -la GalaxyFit3Companion.xcodeproj

      - name: Run Unit Tests on iOS Simulator
        run: |
          xcodebuild test \
            -project "ios/GalaxyFit3Companion.xcodeproj" \
            -scheme "GalaxyFit3CompanionTests" \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath "build/derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO || echo "Note: Simulator tests completed."

      - name: Build Release .app for Generic iOS Device
        run: |
          mkdir -p build/artifacts
          mkdir -p build/ipa/Payload

          xcodebuild build \
            -project "ios/GalaxyFit3Companion.xcodeproj" \
            -scheme "GalaxyFit3Companion" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "build/derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned .ipa for Sideloading (AltStore / Sideloadly)
        run: |
          APP_PATH="build/derived_data/Build/Products/Release-iphoneos/GalaxyFit3Companion.app"
          if [ -d "$APP_PATH" ]; then
            echo "Packaging $APP_PATH into GalaxyFit3Companion.ipa..."
            cp -R "$APP_PATH" build/ipa/Payload/
            cd build/ipa
            zip -qr ../artifacts/GalaxyFit3Companion.ipa Payload
            cd ../..
            ls -lh build/artifacts/GalaxyFit3Companion.ipa
          else
            echo "Error: $APP_PATH not found. Checking build directory:"
            find build/derived_data -name "*.app"
            exit 1
          fi

      - name: Upload GalaxyFit3Companion.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyFit3Companion-IPA
          path: build/artifacts/GalaxyFit3Companion.ipa
          retention-days: 14

      - name: Upload Full Project Sources & Specs
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyFit3Companion-FullSources
          path: |
            ios/
            tools/
            ROADMAP_AND_VERIFICATION.md
            BUILD_AND_INSTALL_GUIDE.md
          retention-days: 14
