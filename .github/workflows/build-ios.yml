name: Build Galaxy Fit3 iOS Companion (IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build & Package iOS App (.ipa)
    runs-on: macos-14 # Apple Silicon (M2) runner with Xcode 16+

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode 16 Version
        run: |
          echo "Available Xcode installations on runner:"
          ls -d /Applications/Xcode*
          # Select Xcode 16 (required for Xcode project format 77)
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project (.xcodeproj)
        run: |
          cd ios
          xcodegen generate --spec project.yml
          ls -la GalaxyFit3Companion.xcodeproj
          cd ..

      - name: Run Unit Tests on iOS Simulator
        run: |
          xcodebuild test \
            -project "ios/GalaxyFit3Companion.xcodeproj" \
            -scheme "GalaxyFit3CompanionTests" \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath "build/derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" || true

      - name: Build Release .app for Generic iOS Device
        run: |
          mkdir -p build/artifacts
          mkdir -p build/ipa/Payload

          xcodebuild build \
            -project "ios/GalaxyFit3Companion.xcodeproj" \
            -scheme "GalaxyFit3Companion" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "build/derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned .ipa for Sideloading (AltStore / Sideloadly)
        run: |
          echo "Searching for built .app bundle..."
          find build/derived_data -name "GalaxyFit3Companion.app"
          APP_PATH=$(find build/derived_data -name "GalaxyFit3Companion.app" -type d | grep "Release-iphoneos" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/derived_data -name "GalaxyFit3Companion.app" -type d | head -n 1)
          fi

          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "Found bundle at: $APP_PATH"
            echo "Injecting curated Info.plist with Bluetooth and HealthKit descriptions..."
            cp ios/GalaxyFit3Companion/Info.plist "$APP_PATH/Info.plist"
            plutil -p "$APP_PATH/Info.plist"
            echo "Copying to Payload directory..."
            cp -R "$APP_PATH" build/ipa/Payload/
            cd build/ipa
            zip -qr ../artifacts/GalaxyFit3Companion.ipa Payload
            cd ../..
            ls -lh build/artifacts/GalaxyFit3Companion.ipa
          else
            echo "Error: GalaxyFit3Companion.app not found. Dumping derived data directory structure:"
            find build/derived_data -maxdepth 4
            exit 1
          fi

      - name: Verify Privacy Keys in Packaged IPA
        run: |
          python3 << 'EOF'
          import zipfile, plistlib
          with zipfile.ZipFile("build/artifacts/GalaxyFit3Companion.ipa") as z:
              data = z.read("Payload/GalaxyFit3Companion.app/Info.plist")
              pl = plistlib.loads(data)
              bundle_id = pl.get("CFBundleIdentifier", "")
              assert not bundle_id.startswith("$"), f"Unexpanded variable in CFBundleIdentifier: {bundle_id}"
              assert "NSBluetoothAlwaysUsageDescription" in pl, "Missing NSBluetoothAlwaysUsageDescription"
              assert "NSHealthShareUsageDescription" in pl, "Missing NSHealthShareUsageDescription"
              assert "NSHealthUpdateUsageDescription" in pl, "Missing NSHealthUpdateUsageDescription"
              assert "NSMotionUsageDescription" in pl, "Missing NSMotionUsageDescription"
              print(f"SUCCESS: Verified Info.plist contains valid bundle ID: {bundle_id}")
              for k, v in pl.items():
                  if "Usage" in k or "Background" in k:
                      print(f"  {k}: {v}")
          EOF

      - name: Upload GalaxyFit3Companion.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyFit3Companion-IPA
          path: build/artifacts/GalaxyFit3Companion.ipa
          retention-days: 14

      - name: Upload Full Project Sources & Specs
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyFit3Companion-FullSources
          path: |
            ios/
            tools/
            ROADMAP_AND_VERIFICATION.md
            BUILD_AND_INSTALL_GUIDE.md
          retention-days: 14
