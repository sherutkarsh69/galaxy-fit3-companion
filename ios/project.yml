name: GalaxyFit3Companion
options:
  bundleIdPrefix: com.galaxyfit3companion
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  GalaxyFit3Companion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GalaxyFit3Companion
        excludes:
          - "Tests/**"
    info:
      path: GalaxyFit3Companion/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.galaxyfit3companion.GalaxyFit3Companion
        PRODUCT_NAME: GalaxyFit3Companion
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: "NO"
    dependencies:
      - sdk: CoreBluetooth.framework
      - sdk: HealthKit.framework
      - sdk: SwiftUI.framework
      - sdk: Combine.framework

  GalaxyFit3CompanionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GalaxyFit3Companion/Tests
    dependencies:
      - target: GalaxyFit3Companion
